<div id="error-container" class="mb-4"></div>

<form id="profile-form" class="space-y-6">

    <!-- Basic Info -->
    <div class="bg-surface-container-low rounded-card p-6">
        <h2 class="font-headline text-lg font-semibold text-on-surface mb-4">Basic Info</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-name">Name</label>
                <input id="field-name" name="name" type="text" readonly
                       value="{{ profile.name }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container text-on-surface-variant text-sm cursor-not-allowed">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-emoji">Emoji</label>
                <input id="field-emoji" name="emoji" type="text"
                       value="{{ profile.emoji }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-budget-min">Budget Min (PLN)</label>
                <input id="field-budget-min" name="budget_min" type="number" min="0"
                       value="{{ profile.budget.min if profile.budget else 0 }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-budget-max">Budget Max (PLN)</label>
                <input id="field-budget-max" name="budget_max" type="number" min="0"
                       value="{{ profile.budget.max if profile.budget else 0 }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-currency">Currency</label>
                <input id="field-currency" name="currency" type="text"
                       value="{{ profile.currency }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
        </div>
    </div>

    <!-- Scoring -->
    <div class="bg-surface-container-low rounded-card p-6">
        <h2 class="font-headline text-lg font-semibold text-on-surface mb-4">Scoring</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-score-threshold">Score Threshold</label>
                <input id="field-score-threshold" name="score_threshold" type="number"
                       value="{{ profile.score_threshold | default(0) }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-score-alert">Score Alert Threshold</label>
                <input id="field-score-alert" name="score_threshold_alert" type="number"
                       value="{{ profile.score_threshold_alert | default(0) }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
        </div>

        <!-- Score Rules -->
        <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium text-on-surface">Score Rules</h3>
                <button type="button" onclick="addRule('score-rules-list')"
                        class="inline-flex items-center gap-1 px-3 py-1.5 bg-primary-container text-on-primary-container rounded-card text-xs font-medium hover:bg-primary-container/70 transition-colors">
                    <span class="material-symbols-outlined text-[14px]">add</span>Add Rule
                </button>
            </div>
            <div id="score-rules-list" class="space-y-2">
                {% for keyword, points in (profile.score_rules or {}).items() %}
                <div class="flex items-center gap-2 rule-row">
                    <input type="text" placeholder="keyword" value="{{ keyword }}"
                           class="rule-key flex-1 px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
                    <input type="number" placeholder="points" value="{{ points }}"
                           class="rule-val w-24 px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
                    <button type="button" onclick="removeRow(this)"
                            class="text-on-surface-variant hover:text-error transition-colors flex-shrink-0">
                        <span class="material-symbols-outlined text-[18px]">remove_circle</span>
                    </button>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Penalties -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium text-on-surface">Penalties</h3>
                <button type="button" onclick="addRule('penalties-list')"
                        class="inline-flex items-center gap-1 px-3 py-1.5 bg-error-container/20 text-error rounded-card text-xs font-medium hover:bg-error-container/30 transition-colors">
                    <span class="material-symbols-outlined text-[14px]">add</span>Add Penalty
                </button>
            </div>
            <div id="penalties-list" class="space-y-2">
                {% for keyword, points in (profile.penalties or {}).items() %}
                <div class="flex items-center gap-2 rule-row">
                    <input type="text" placeholder="keyword" value="{{ keyword }}"
                           class="rule-key flex-1 px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
                    <input type="number" placeholder="points" value="{{ points }}"
                           class="rule-val w-24 px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
                    <button type="button" onclick="removeRow(this)"
                            class="text-on-surface-variant hover:text-error transition-colors flex-shrink-0">
                        <span class="material-symbols-outlined text-[18px]">remove_circle</span>
                    </button>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-surface-container-low rounded-card p-6">
        <h2 class="font-headline text-lg font-semibold text-on-surface mb-4">Filters</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-excluded">Excluded Words <span class="text-xs">(comma-separated)</span></label>
                <input id="field-excluded" name="excluded_words" type="text"
                       value="{{ (profile.excluded_words or []) | join(', ') }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-required">Required Any <span class="text-xs">(comma-separated)</span></label>
                <input id="field-required" name="required_any" type="text"
                       value="{{ (profile.required_any or []) | join(', ') }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
        </div>
    </div>

    <!-- Telegram -->
    <div class="bg-surface-container-low rounded-card p-6">
        <h2 class="font-headline text-lg font-semibold text-on-surface mb-4">Telegram</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-topic-id">Topic ID</label>
                <input id="field-topic-id" name="topic_id" type="number"
                       value="{{ profile.telegram.topic_id if profile.telegram else '' }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-on-surface-variant mb-1" for="field-max-alerts">Max Alerts</label>
                <input id="field-max-alerts" name="max_alerts" type="number" min="1"
                       value="{{ profile.telegram.max_alerts if profile.telegram else 5 }}"
                       class="w-full px-3 py-2 rounded-card border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:border-primary">
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
        <button type="submit"
                class="inline-flex items-center gap-2 px-5 py-2.5 bg-primary text-on-primary rounded-card text-sm font-medium hover:bg-primary-dim transition-colors">
            <span class="material-symbols-outlined text-[18px]">save</span>Save Changes
        </button>
        <a hx-get="/profiles/{{ profile.name }}?tab=overview"
           hx-target="#profile-content"
           hx-push-url="true"
           class="inline-flex items-center gap-2 px-5 py-2.5 bg-surface-container-high text-on-surface rounded-card text-sm font-medium hover:bg-surface-container-highest transition-colors cursor-pointer">
            Cancel
        </a>
    </div>

</form>

<script src="/static/js/profile-form.js"></script>
<script>
document.getElementById('profile-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var name = document.getElementById('field-name').value;
    var topicVal = document.getElementById('field-topic-id').value;
    var maxAlertsVal = document.getElementById('field-max-alerts').value;
    var body = {
        name: name,
        emoji: document.getElementById('field-emoji').value.trim() || '\ud83d\udd0d',
        budget: {
            min: parseInt(document.getElementById('field-budget-min').value, 10) || 0,
            max: parseInt(document.getElementById('field-budget-max').value, 10) || 0
        },
        currency: document.getElementById('field-currency').value.trim() || 'PLN',
        score_threshold: parseInt(document.getElementById('field-score-threshold').value, 10) || 0,
        score_threshold_alert: parseInt(document.getElementById('field-score-alert').value, 10) || 0,
        score_rules: collectRulesFromList('score-rules-list'),
        penalties: collectRulesFromList('penalties-list'),
        excluded_words: splitComma(document.getElementById('field-excluded').value),
        required_any: splitComma(document.getElementById('field-required').value),
        telegram: {
            topic_id: topicVal !== '' ? parseInt(topicVal, 10) : null,
            max_alerts: maxAlertsVal !== '' ? parseInt(maxAlertsVal, 10) : 5
        }
    };

    fetch('/api/profiles/' + encodeURIComponent(name), {
        method: 'PUT',
        headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
        body: JSON.stringify(body)
    })
    .then(function(resp) { return resp.json(); })
    .then(function(data) {
        if (data.ok) {
            htmx.ajax('GET', '/profiles/' + encodeURIComponent(name) + '?tab=overview', {target: '#profile-content', pushUrl: true});
        } else {
            showErrors('error-container', data.errors || ['Unknown error']);
        }
    })
    .catch(function(err) {
        showErrors('error-container', ['Network error: ' + err.message]);
    });
});
</script>
