<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DealMonitor{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- CodeMirror (YAML editor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/material-darker.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#005db5',
                        'primary-dim': '#0052a0',
                        'primary-container': '#d6e3ff',
                        'on-primary': '#f6f7ff',
                        'on-primary-container': '#00519e',
                        'secondary': '#526074',
                        'secondary-container': '#d5e3fc',
                        'on-secondary': '#f8f8ff',
                        'on-secondary-container': '#455367',
                        'tertiary': '#006b62',
                        'tertiary-container': '#91feef',
                        'on-tertiary': '#e2fff9',
                        'on-tertiary-container': '#006259',
                        'background': '#faf8ff',
                        'surface': '#faf8ff',
                        'surface-dim': '#cdd9ff',
                        'surface-container': '#eaedff',
                        'surface-container-high': '#e2e7ff',
                        'surface-container-highest': '#d9e2ff',
                        'surface-container-low': '#f2f3ff',
                        'surface-container-lowest': '#ffffff',
                        'surface-variant': '#d9e2ff',
                        'on-surface': '#113069',
                        'on-surface-variant': '#445d99',
                        'on-background': '#113069',
                        'error': '#9f403d',
                        'error-container': '#fe8983',
                        'on-error': '#fff7f6',
                        'on-error-container': '#752121',
                        'outline': '#6079b7',
                        'outline-variant': '#98b1f2',
                        'inverse-surface': '#060e20',
                        'inverse-primary': '#5f9efb',
                    },
                    fontFamily: {
                        'headline': ['Manrope', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                        'label': ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'card': '0.75rem',
                    },
                },
            },
        }
    </script>

    <!-- Chart.js + dashboard chart helpers (loaded in head so inline page
         scripts that call createSparkline / createTrendSparkline can see them) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/charts.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- CodeMirror (YAML editor) -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/yaml/yaml.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #113069;
            background-color: #faf8ff;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
        .progress-bar { animation: progress-indeterminate 1.5s ease-in-out infinite; }
        @keyframes progress-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar overlay (mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-surface-container-low flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out">
            <!-- Branding -->
            <div class="p-6 pb-4">
                <h1 class="font-headline text-xl font-bold text-primary">DealMonitor</h1>
                <p class="text-xs text-on-surface-variant font-label tracking-wider uppercase mt-1">Analytical Atelier</p>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 space-y-1">
                <a href="/deals" class="flex items-center gap-3 px-4 py-3 rounded-card text-sm font-medium transition-colors {% if active_page == 'deals' %}bg-surface-container-high text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
                    <span class="material-symbols-outlined text-[20px]">search</span>
                    Deals Explorer
                </a>
                <a href="/watchlist" class="flex items-center gap-3 px-4 py-3 rounded-card text-sm font-medium transition-colors {% if active_page == 'watchlist' %}bg-surface-container-high text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
                    <span class="material-symbols-outlined text-[20px]">bookmark</span>
                    Watchlist
                </a>
                <a href="/alerts" class="flex items-center gap-3 px-4 py-3 rounded-card text-sm font-medium transition-colors {% if active_page == 'alerts' %}bg-surface-container-high text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
                    <span class="material-symbols-outlined text-[20px]">notifications_active</span>
                    Price Alerts
                </a>
                <a href="/profiles" class="flex items-center gap-3 px-4 py-3 rounded-card text-sm font-medium transition-colors {% if active_page == 'profiles' %}bg-surface-container-high text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
                    <span class="material-symbols-outlined text-[20px]">tune</span>
                    Profiles
                </a>
                <a href="/notifications" class="flex items-center gap-3 px-4 py-3 rounded-card text-sm font-medium transition-colors {% if active_page == 'notifications' %}bg-surface-container-high text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
                    <span class="material-symbols-outlined text-[20px]">notifications_off</span>
                    Notifications
                </a>
            </nav>

            <!-- Footer: health indicator + version -->
            <div class="px-6 py-4 space-y-2">
                <div hx-get="/api/health-status" hx-trigger="load" hx-swap="innerHTML">
                    <a href="/health" class="flex items-center gap-2 text-xs font-label text-on-surface-variant">
                        <span class="w-2 h-2 rounded-full bg-outline-variant"></span>
                        Loading...
                    </a>
                </div>
                <p class="text-xs text-on-surface-variant font-label">v{{ app_version }}</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 overflow-x-hidden">
            <!-- Header -->
            <header class="sticky top-0 z-20 bg-surface/80 backdrop-blur-xl px-4 sm:px-8 py-4 flex items-center gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden text-on-surface-variant hover:text-on-surface">
                    <span class="material-symbols-outlined text-[24px]">menu</span>
                </button>
                <h2 class="font-headline text-lg font-semibold min-w-0">{% block page_title %}Dashboard{% endblock %}</h2>
            </header>
            <div class="htmx-indicator h-0.5 overflow-hidden bg-surface-container">
                <div class="progress-bar h-full w-1/4 bg-primary rounded-full"></div>
            </div>

            <!-- Page Content -->
            <div class="px-4 sm:px-8 py-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/sparklines.js"></script>
</body>
</html>
