name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy types-requests types-beautifulsoup4 types-PyYAML

      - name: Ruff check (linting)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy --ignore-missing-imports deal_hunter.py sources/ filters/ notifiers/ utils/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ --ignore=tests/e2e -v --tb=short --cov=sources --cov=filters --cov=deal_hunter --cov-report=term-missing

      - name: Smoke test — version
        run: python deal_hunter.py --version

      - name: Smoke test — list profiles
        run: python deal_hunter.py --list
