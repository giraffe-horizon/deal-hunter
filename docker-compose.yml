services:
  deal-hunter-migrate:
    # One-shot service that runs `alembic upgrade head` and exits.
    # All long-running services depend on it via `service_completed_successfully`
    # so the database schema is always at the latest revision before the cron,
    # bot or dashboard touches it. Safe to re-run (no-op if already current).
    build: .
    container_name: deal-hunter-migrate
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    entrypoint: ["tini", "--"]
    command:
      - alembic
      - -c
      - /app/src/deal_hunter/storage/migrations/alembic.ini
      - upgrade
      - head
    volumes:
      - ./state:/app/state
    restart: "no"

  deal-hunter:
    # image: ghcr.io/giraffe-horizon/deal-hunter:latest  # pre-built
    build: .  # or build locally
    container_name: deal-hunter
    restart: unless-stopped
    env_file: .env
    environment:
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - WATCHDOG_SCHEDULE=${WATCHDOG_SCHEDULE:-0 */1 * * *}
      - DIGEST_SCHEDULE=${DIGEST_SCHEDULE:-0 8 * * 1}
      - TZ=${TZ:-Europe/Warsaw}
    volumes:
      - ./profiles:/app/profiles
      - ./state:/app/state
    depends_on:
      deal-hunter-migrate:
        condition: service_completed_successfully

  deal-hunter-bot:
    # image: ghcr.io/giraffe-horizon/deal-hunter:latest  # pre-built
    build: .  # or build locally
    container_name: deal-hunter-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    entrypoint: ["tini", "--"]
    command: ["deal-hunter-bot"]
    volumes:
      - ./profiles:/app/profiles
      - ./state:/app/state
    depends_on:
      deal-hunter-migrate:
        condition: service_completed_successfully
      deal-hunter:
        condition: service_started

  deal-hunter-web:
    build: .
    container_name: deal-hunter-web
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    entrypoint: ["tini", "--"]
    command: ["python", "-m", "uvicorn", "deal_hunter.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./profiles:/app/profiles
      - ./state:/app/state
    depends_on:
      deal-hunter-migrate:
        condition: service_completed_successfully
      deal-hunter:
        condition: service_started
