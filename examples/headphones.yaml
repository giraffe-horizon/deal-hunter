# Example profile: Headphones
#
# This is a working example profile that searches for wireless ANC headphones
# on Pepper.pl and Ceneo.pl. Use it as a starting point for your own profiles.
#
# Try it:
#   python deal_hunter.py --profile headphones --verify
#
# For the full profile reference, see docs/creating-profiles.md

# Profile identity — shown in alerts and logs
name: headphones
emoji: "🎧"

# Where to search — each key maps to a registered source plugin
sources:
  pepper:
    urls:
      - "https://www.pepper.pl/search?q=s%C5%82uchawki+bezprzewodowe+ANC"
  ceneo:
    queries:
      - "słuchawki bezprzewodowe ANC"

# Price range (PLN) — deals outside this range get score penalties
budget:
  min: 150
  max: 800

# Positive scoring rules — each keyword adds points when found in title or description
# Higher points = stronger signal that this deal is relevant
score_rules:
  "noise cancelling": 30
  "ANC": 30
  sony: 40
  "WH-1000XM": 50
  bose: 35
  "QuietComfort": 40
  sennheiser: 30
  "momentum": 25
  "jabra": 20
  "bluetooth 5": 10
  "LDAC": 15

# Penalties — keywords that reduce score (use negative values)
penalties:
  "przewodowe": -50
  "wired": -50
  "gaming": -30
  "dla graczy": -30
  "mono": -40
  "zestaw głośnomówiący": -20

# Hard filters (optional)
# excluded_words — any match = deal is rejected outright
excluded_words:
  - "etui"
  - "case"
  - "ear tips"
  - "wkładki"
  - "nakładki"

# Scoring thresholds — control which deals trigger alerts
score_threshold: 40        # minimum score to appear in alerts
score_threshold_alert: 80  # score for "TOP DEAL" tier

# Telegram settings — topic_id is the forum thread ID, max_alerts caps individual messages
telegram:
  topic_id: null
  max_alerts: 5
