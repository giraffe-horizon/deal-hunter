[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-hunter"
version = "0.11.2"
description = "Universal multi-source deal monitor with YAML profiles, scoring engine, and Telegram alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "giraffe-horizon"},
]
keywords = ["deals", "monitor", "scraper", "telegram", "price-tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.25",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]

[project.scripts]
deal-hunter = "deal_hunter:main"

[project.urls]
Homepage = "https://github.com/giraffe-horizon/deal-hunter"
Repository = "https://github.com/giraffe-horizon/deal-hunter"
Issues = "https://github.com/giraffe-horizon/deal-hunter/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "types-beautifulsoup4",
    "types-PyYAML",
    "matplotlib>=3.8",
    "python-telegram-bot>=21.0",
    "httpx",
]
e2e = [
    "pytest-playwright>=0.4",
]

[tool.setuptools.packages.find]
include = ["sources*", "filters*", "notifiers*", "utils*", "dashboard*", "storage*", "visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end browser tests (require live server + Playwright)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "C90", "B", "A"]
ignore = ["E501", "S101", "B008", "C901"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["telegram.*", "matplotlib.*", "rich.*"]
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["deal_hunter.py:__version__"]
branch = "main"
commit_message = "chore(release): {version}"
build_command = ""
upload_to_pypi = false
tag_format = "v{version}"
major_on_zero = false
