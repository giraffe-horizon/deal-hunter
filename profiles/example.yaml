# ============================================================================
# Deal Hunter — Example Product Profile
# ============================================================================
# This file shows ALL available configuration options.
# Copy it and customize for your needs:
#   cp profiles/example.yaml profiles/my_product.yaml
#
# Detailed documentation: docs/creating-profiles.md
# ============================================================================

# --- Name and identification ---
# Profile name (used in CLI: --profile name)
name: example
# Emoji displayed in Telegram alerts
emoji: "🎯"

# --- Currency (optional, default PLN) ---
# Used in Telegram alerts and console output
currency: PLN

# --- Sources to scan ---
# You can use one or many sources simultaneously.
# Each source has its own configuration.
sources:
  # Pepper.pl — deal/promotion aggregator
  # Config: list of URLs to scrape (category pages or search results)
  pepper:
    urls:
      - "https://www.pepper.pl/search?q=your+search+query"
      - "https://www.pepper.pl/grupa/category"
      # You can add multiple pages, e.g. pagination:
      # - "https://www.pepper.pl/grupa/category?page=2"

  # Ceneo.pl — price comparison engine
  # Config: list of text search queries
  ceneo:
    queries:
      - "product name"
      - "alternative phrase"

  # Proshop.pl — online store
  # Config: list of text search queries
  proshop:
    queries:
      - "product name"

  # Generic web scraper — any website with products
  # Define CSS selectors and Deal Hunter extracts the data
  # web:
  #   sites:
  #     - url: "https://example.com/deals"
  #       base_url: "https://example.com"
  #       selectors:
  #         container: "div.product-card"      # container for a single product
  #         title: "h2.product-name"           # title — element text
  #         price: "span.price"                # price — text with number
  #         link: "a.product-link@href"        # link — @attr extracts HTML attribute
  #         image: "img.product-img@src"       # image — @attr extracts src

# --- Budget (PLN) ---
# Offers in budget range get a +5 point bonus.
# Below min -> -20 penalty, above max -> -30 penalty.
budget:
  min: 100
  max: 500

# --- Scoring rules (positive points) ---
# Keyword found in title or description -> adds points.
# Higher points = more important keyword.
# Case-insensitive matching.
#
# Supports regex with r/pattern/ syntax:
#   "r/\\b(model1|model2)\\b/": 30   <- matches whole words
#   "r/\\d{2}\\s*mm/": 10             <- matches e.g. "32 mm", "28mm"
score_rules:
  # Product/model name -> high points
  "premium model": 50
  "standard model": 30
  # Desired features -> medium points
  "feature1": 25
  "feature2": 20
  # Less important features -> low points
  "nice bonus": 10
  new: 10
  # Regex example — matches size variants
  # "r/\\b(xl|xxl|58|60)\\b/": 10

# --- Penalties (negative points) ---
# Keyword -> subtracts points. Values should be negative.
# Supports regex just like score_rules.
penalties:
  # Unwanted variants
  "bad model": -40
  used: -25
  refurbished: -30
  # Completely different products (search false positives)
  "different product": -50

# --- Required words (optional) ---
# At least ONE of these words must appear in the offer.
# If none match -> offer rejected (hard reject).
# Supports regex: "r/\\brequired\\b/"
# Useful when searching for a specific capacity, size, etc.
required_any:
  - "required_word1"
  - "required_word2"

# --- Excluded words (optional) ---
# If ANY of these words appears -> offer rejected (hard reject).
# Supports regex: "r/\\bspam\\w*/".
# Useful for filtering out unwanted categories.
excluded_words:
  - "spam"
  - "unwanted_category"

# --- Scoring thresholds ---
# Minimum score for the offer to appear as an alert
score_threshold: 50
# Score at which the offer is marked as "top deal" 🔥🔥🔥
score_threshold_alert: 80

# --- Custom filter (optional) ---
# If the base scoring isn't enough, you can attach a custom filter.
# The filter must inherit from BaseFilter and be registered in filters/__init__.py.
# Format: "filename.ClassName" (file in the filters/ directory)
# custom_filter: "bike_filter.BikeFilter"

# --- Custom data (optional) ---
# Arbitrary data passed to the custom filter via self.profile["custom_data"].
# Structure depends on your filter — this is just an example.
# custom_data:
#   preferred_sizes: ["L", "XL"]
#   excluded_colors:
#     - "white"
#     - "yellow"
#   extra_config:
#     strict_mode: true

# --- Telegram notifications ---
# topic_id — thread ID in a Telegram group (if the group has threads/topics).
#   Find it in the thread URL: t.me/c/GROUPID/TOPICID
# max_alerts — max number of alerts sent per run.
#   Protects against message floods when there are many results.
telegram:
  topic_id: 31
  max_alerts: 5

# --- Notion notifications (optional) ---
# Set to null to disable Notion.
# To enable -> provide the database_id of your Notion database.
# Requires NOTION_API_KEY_PATH configured in .env
#
# categories — maps category names to keywords (optional).
# If not provided -> profile name is used as the category.
notion: null
# notion:
#   database_id: "your-notion-database-id"
#   categories:
#     "electronics": ["laptop", "phone", "tablet", "smartwatch"]
#     "audio": ["headphones", "speaker", "soundbar", "dac"]
#     "accessories": ["case", "charger", "cable", "adapter"]

# --- Price tracking (automatic) ---
# Deal Hunter automatically tracks price changes. If an offer reappears
# with a lower price (>10% drop or >50 PLN), the alert includes price drop info.
# No configuration needed — works out of the box.
